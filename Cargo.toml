[package]
name = "nautus"
version = "1.6.3"
edition = "2021"
authors = ["greencoder001"]
description = "Your one & only ultimate software development tool 🪸"
license = "MIT"
repository = "https://github.com/cabraviva/nautus"
keywords = ["nautus", "software", "development", "cli", "tui"]

[[bin]]
name = "nautus"
path = "src/main.rs"

[dependencies]
# CLI and TUI
clap = { version = "4.5", features = ["derive", "cargo"] }
ratatui = "0.28"
crossterm = "0.28"

# JavaScript execution
deno_core = "0.312"
tokio = { version = "1.40", features = ["full"] }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
colored = "2.1"

# File system and paths
glob = "0.3"
walkdir = "2.5"
ignore = "0.4"
fs_extra = "1.3"

# HTTP and API
reqwest = { version = "0.12", features = ["json", "cookies"] }

# Process execution
which = "6.0"

# File watching
notify = "6.1"

# Other utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zip = "2.2"
